run_name: null  # Used as the output directory name and the wandb run name with the highest priority.

wandb:
  launch: false
  entity: entity
  project: project

tokenize_kwargs:
  add_special_tokens: true

model:
  model: llm-jp/llm-jp-3-3.7b-instruct
  # reasoning_parser: qwen3

# apply_chat_template: true
# Required for datasets with tools, e.g. JMultiWOZ-TC (same names as the vLLM server options)
# tool_call_parser: hermes
# tool_parser_plugin: null

tokenizer:
  pretrained_model_name_or_path: llm-jp/llm-jp-3-3.7b-instruct

prompt_json_path: '../../../local_files/datasets/2.0.0/evaluation/path/to/prompts/*.eval-prompt.json'
